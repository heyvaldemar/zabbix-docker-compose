name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck ./*.sh

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: postgres
            env_var: ZABBIX_POSTGRES_IMAGE_TAG
            skip_files: "usr/local/bin/gosu,/usr/local/bin/gosu,etc/ssl/private/ssl-cert-snakeoil.key,/etc/ssl/private/ssl-cert-snakeoil.key"
          - name: zabbix-server
            env_var: ZABBIX_SERVER_IMAGE_TAG
          - name: zabbix-web
            env_var: ZABBIX_WEB_IMAGE_TAG
          - name: zabbix-agent
            env_var: ZABBIX_AGENT_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -oE "\\$\\{${ENV_VAR}:-[^}]+\\}" zabbix-docker-compose.yml | head -1 | sed -E "s/^\\$\\{${ENV_VAR}:-//; s/\\}$//")"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-files: ${{ matrix.skip_files }}

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Weekly cron + manual dispatch only — this job is the actual pin
    # tracking mechanism (Dependabot cannot see compose interpolation
    # defaults).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned digests against what each tag resolves to now
        run: |
          status=0
          for var in ZABBIX_POSTGRES_IMAGE_TAG ZABBIX_SERVER_IMAGE_TAG ZABBIX_WEB_IMAGE_TAG ZABBIX_AGENT_IMAGE_TAG; do
            pin="$(grep -oE "\\$\\{${var}:-[^}]+\\}" zabbix-docker-compose.yml | head -1 | sed -E "s/^\\$\\{${var}:-//; s/\\}$//")"
            ref="${pin%%@*}"
            pinned_digest="${pin##*@}"
            current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ "$pinned_digest" != "$current_digest" ]; then
              echo "::error::${var} digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
              status=1
            else
              echo "${var} OK (${ref})"
            fi
          done
          exit "$status"

      - name: Compare pinned Zabbix version against its release line
        # Pinned to the 7.0 LTS line on purpose (EOL 2029) — compare against
        # the latest patch of THAT line via endoflife.date, and fail if the
        # line itself has gone end-of-life.
        run: |
          pin="$(grep -m1 -oE '\$\{ZABBIX_SERVER_IMAGE_TAG:-.*' zabbix-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"
          tag="${ref##*:}"
          pinned_version="${tag%-ubuntu}"
          cycle="${pinned_version%.*}"
          eol_json="$(curl -fsSL --retry 3 "https://endoflife.date/api/zabbix.json")"
          latest="$(echo "$eol_json" | jq -r --arg c "$cycle" '.[] | select(.cycle==$c) | .latest')"
          eol="$(echo "$eol_json" | jq -r --arg c "$cycle" '.[] | select(.cycle==$c) | .eol')"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not determine the latest Zabbix release for line ${cycle}"
            exit 1
          fi
          if [ "$pinned_version" != "$latest" ]; then
            echo "::error::Zabbix pin is behind its line: pinned ${pinned_version}, latest in ${cycle} is ${latest}"
            exit 1
          fi
          if [ "$(date -d "$eol" +%s)" -le "$(date +%s)" ]; then
            echo "::error::Zabbix ${cycle} line is end-of-life since ${eol} — move to a supported line"
            exit 1
          fi
          echo "Zabbix pin ${pinned_version} is current in line ${cycle} (EOL ${eol})"

  deploy-and-test:
    name: docker compose up + Zabbix API smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      DOCKER_COMPOSE_FILE: zabbix-docker-compose.yml
      COMPOSE_PROJECT_NAME: zabbix
      NETWORK_ONE: zabbix-network

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the Docker network
        run: docker network create "$NETWORK_ONE" || true

      - name: Generate test .env with ephemeral credentials
        # No *_IMAGE_TAG values on purpose: the compose x-images defaults
        # apply, so CI tests exactly the pins the template ships.
        run: |
          cat > .env <<EOF
          ZABBIX_DB_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          ZABBIX_BACKUP_INIT_SLEEP=15s
          ZABBIX_BACKUP_INTERVAL=60s
          EOF
          echo "Generated ephemeral .env for CI run"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Wait for the Zabbix server to report healthy
        run: |
          echo "Waiting for the zabbix-server container healthcheck..."
          # $COMPOSE_PROJECT_NAME and the inspect template are expanded by
          # the inner bash -c / docker, not the outer shell.
          # shellcheck disable=SC2016
          timeout 5m bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker ps -qf name=${COMPOSE_PROJECT_NAME}-zabbix-server)")" = "healthy" ]; do
            echo "Still starting..."
            sleep 10
          done'

      - name: Verify the Zabbix web API answers on port 80
        run: |
          timeout 5m bash -c 'while ! curl -fs -X POST "http://localhost:80/api_jsonrpc.php" -H "Content-Type: application/json" -d "{\"jsonrpc\":\"2.0\",\"method\":\"apiinfo.version\",\"params\":{},\"id\":1}" | grep -q "\"result\""; do
            echo "Waiting for the Zabbix web API..."
            sleep 10
          done'
          curl -fs -X POST "http://localhost:80/api_jsonrpc.php" -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","method":"apiinfo.version","params":{},"id":1}'
          echo

      - name: Verify a backup is produced and valid
        # Log-driven: the file named in a 'backup OK' line is complete by
        # definition, so this never races a dump that is still being written.
        run: |
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -q "Database backup OK"; do echo "Waiting for the first backup cycle..."; sleep 10; done'
          db=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Database backup OK" | tail -1 | sed -E 's/.*Database backup OK: ([^ ]+) .*/\1/')
          echo "Database backup file: $db"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "gunzip -t '$db' && gunzip -c '$db' | head -5 | grep -qE 'PostgreSQL database dump'" && echo "Database backup valid: $db"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -i "backup FAILED" && { echo "::error::the backups log reports a failure"; exit 1; } || true

      - name: Run the backup/restore end-to-end tests
        # Seven scenarios against the live stack: required-env guard, backup
        # produced, readable, valid content, failure detected when the
        # database is down, restore genuinely replaces state, prune keeps
        # recent files. Same script a maintainer runs locally.
        run: |
          chmod +x tests/e2e-backup-restore.sh
          ./tests/e2e-backup-restore.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down
