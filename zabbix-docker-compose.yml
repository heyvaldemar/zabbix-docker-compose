# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  postgres: &postgres-image ${ZABBIX_POSTGRES_IMAGE_TAG:-postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957}
  zabbix-server: &zabbix-server-image ${ZABBIX_SERVER_IMAGE_TAG:-zabbix/zabbix-server-pgsql:7.0.30-ubuntu@sha256:de9b1471dff77298d5a709b89f275fc5b9ba343058d8deee1f55c7ca9830bb0b}
  zabbix-web: &zabbix-web-image ${ZABBIX_WEB_IMAGE_TAG:-zabbix/zabbix-web-nginx-pgsql:7.0.30-ubuntu@sha256:1e68b65358f6464421f94a6ca627220066a8998d04f6360176b7ef6d984a6031}
  zabbix-agent: &zabbix-agent-image ${ZABBIX_AGENT_IMAGE_TAG:-zabbix/zabbix-agent2:7.0.30-ubuntu@sha256:504f4bda39dcd0d1e5b120e61966121d21669cf737348a9a47ae04bd32db9f53}

networks:
  zabbix-network:
    external: true

volumes:
  zabbix-postgres:
  zabbix-postgres-backup:
  zabbix-database-backups:

services:
  postgres:
    image: *postgres-image
    # Resource limits as .env-overridable defaults (e.g. ZABBIX_POSTGRES_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZABBIX_POSTGRES_MEMORY_LIMIT:-1g}
          cpus: "${ZABBIX_POSTGRES_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZABBIX_POSTGRES_MEMORY_RESERVATION:-128m}
          cpus: "${ZABBIX_POSTGRES_CPU_RESERVATION:-0.25}"
    volumes:
      - zabbix-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbixdb}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbixdbuser}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - zabbix-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${ZABBIX_DB_NAME:-zabbixdb}", "-U", "${ZABBIX_DB_USER:-zabbixdbuser}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  zabbix-server:
    image: *zabbix-server-image
    # Resource limits as .env-overridable defaults (e.g. ZABBIX_SERVER_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZABBIX_SERVER_MEMORY_LIMIT:-1g}
          cpus: "${ZABBIX_SERVER_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZABBIX_SERVER_MEMORY_RESERVATION:-128m}
          cpus: "${ZABBIX_SERVER_CPU_RESERVATION:-0.25}"
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbixdb}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbixdbuser}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_CACHESIZE: ${ZABBIX_CACHESIZE:-1G}
    networks:
      - zabbix-network
    ports:
      - "10051:10051"
    healthcheck:
      test: grep -qr "zabbix_server" /proc/*/status || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  zabbix-dashboard:
    image: *zabbix-web-image
    # Resource limits as .env-overridable defaults (e.g. ZABBIX_DASHBOARD_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZABBIX_DASHBOARD_MEMORY_LIMIT:-512m}
          cpus: "${ZABBIX_DASHBOARD_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZABBIX_DASHBOARD_MEMORY_RESERVATION:-64m}
          cpus: "${ZABBIX_DASHBOARD_CPU_RESERVATION:-0.25}"
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbixdb}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbixdbuser}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${ZABBIX_TIMEZONE:-UTC}
    networks:
      - zabbix-network
    ports:
      - "80:8080"
      - "443:8443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy

  zabbix-agent:
    image: *zabbix-agent-image
    # Resource limits as .env-overridable defaults (e.g. ZABBIX_AGENT_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZABBIX_AGENT_MEMORY_LIMIT:-512m}
          cpus: "${ZABBIX_AGENT_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZABBIX_AGENT_MEMORY_RESERVATION:-64m}
          cpus: "${ZABBIX_AGENT_CPU_RESERVATION:-0.25}"
    environment:
      ZBX_HOSTNAME: Zabbix server
      ZBX_SERVER_HOST: zabbix-server
    networks:
      - zabbix-network
    restart: unless-stopped
    depends_on:
      - postgres
      - zabbix-server

  backups:
    image: *postgres-image
    # Resource limits as .env-overridable defaults (e.g. ZABBIX_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZABBIX_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${ZABBIX_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${ZABBIX_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${ZABBIX_BACKUPS_CPU_RESERVATION:-0.1}"
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$ZABBIX_BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$ZABBIX_POSTGRES_BACKUPS_PATH/$$ZABBIX_POSTGRES_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if pg_dump -h postgres -p 5432 -d $$ZABBIX_DB_NAME -U $$ZABBIX_DB_USER | gzip > "$$DB_FILE"; then
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$ZABBIX_POSTGRES_BACKUPS_PATH" -type f -name "$$ZABBIX_POSTGRES_BACKUP_NAME-*" -mtime "+$$ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$ZABBIX_BACKUP_INTERVAL";
      done'
    volumes:
      - zabbix-postgres-backup:/var/lib/postgresql/data
      - zabbix-database-backups:${ZABBIX_POSTGRES_BACKUPS_PATH:-/srv/zabbix-postgres/backups}
    environment:
      ZABBIX_DB_NAME: ${ZABBIX_DB_NAME:-zabbixdb}
      ZABBIX_DB_USER: ${ZABBIX_DB_USER:-zabbixdbuser}
      PGPASSWORD: ${ZABBIX_DB_PASSWORD}
      ZABBIX_BACKUP_INIT_SLEEP: ${ZABBIX_BACKUP_INIT_SLEEP:-30m}
      ZABBIX_BACKUP_INTERVAL: ${ZABBIX_BACKUP_INTERVAL:-24h}
      ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS: ${ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS:-7}
      ZABBIX_POSTGRES_BACKUPS_PATH: ${ZABBIX_POSTGRES_BACKUPS_PATH:-/srv/zabbix-postgres/backups}
      ZABBIX_POSTGRES_BACKUP_NAME: ${ZABBIX_POSTGRES_BACKUP_NAME:-zabbix-postgres-backup}
    networks:
      - zabbix-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
